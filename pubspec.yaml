name: businessfinder
description: Duhuze - Africa Connected. People, pages and businesses in one app.
publish_to: 'none'
version: 1.0.0+4

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & Design
  google_fonts: ^6.1.0
  smooth_page_indicator: ^1.1.0

  # State Management
  flutter_riverpod: ^2.4.9

  # Navigation & Routing
  go_router: ^13.0.1

  # Firebase Core
  firebase_core: ^2.28.0
  firebase_auth: ^4.15.2
  cloud_firestore: ^4.17.0
  firebase_database: ^10.5.7
  firebase_messaging: ^14.7.10

  # Utilities
  intl: ^0.19.0
  crypto: ^3.0.6
  image_picker: ^1.0.4
  cached_network_image: ^3.3.0
  # Resize photos before upload on Windows (lib/core/services/image_shrinker.dart)
  image: ^4.2.0
  flutter_cache_manager: ^3.4.1
  path_provider: ^2.1.1
  url_launcher: ^6.2.5
  # The phone/PC share menu (WhatsApp, Telegram, email...) for posts.
  share_plus: ^10.1.4
  video_player: ^2.9.2
  video_thumbnail: ^0.5.3
  video_compress: ^3.1.4
  visibility_detector: ^0.4.0+2
  file_picker: ^8.0.0
  connectivity_plus: ^6.0.5
  record: ^5.2.1
  audioplayers: ^5.2.1
  google_sign_in: ^6.2.2
  google_sign_in_all_platforms: ^1.2.1
  country_code_picker: ^3.3.0
  flutter_webrtc: ^0.12.6+hotfix.1
  flutter_local_notifications: ^17.2.4
  win_toast: ^0.4.0

  # Cross-platform video player for Windows support
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_windows_video: ^1.0.11


  # Maps & Location
  geolocator: ^10.1.0
  geocoding: ^2.1.1
  google_maps_flutter: ^2.12.3
  flutter_map: ^6.2.1
  latlong2: ^0.9.1

  # Charts
  fl_chart: ^0.66.2

  # Forms & Validation
  # formz removed (unused)

dependency_overrides:
  firebase_auth:
    path: third_party/firebase_auth_windows_patch
  record_platform_interface: 1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.8
  # codegen tools removed (unused)
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

# Duhuze icon (concept A). Regenerate with: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  windows:
    generate: true
    image_path: assets/images/duhuze_logo.png
    icon_size: 256
  image_path: assets/images/duhuze_icon.png
  adaptive_icon_background: "#3A6EA5"
  adaptive_icon_foreground: assets/images/duhuze_icon_foreground.png
  min_sdk_android: 21

fonts:
  - family: RobotoMono
    fonts:
      - asset: assets/fonts/RobotoMono-Regular.ttf
      - asset: assets/fonts/RobotoMono-Bold.ttf
        weight: 700

