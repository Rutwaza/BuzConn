name: businessfinder
description: A platform connecting businesses with clients
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & Design
  google_fonts: ^6.1.0
  smooth_page_indicator: ^1.1.0

  # State Management
  flutter_riverpod: ^2.4.9

  # Navigation & Routing
  go_router: ^13.0.1

  # Firebase Core
  firebase_core: ^2.28.0
  firebase_auth: ^4.15.2
  cloud_firestore: ^4.17.0
  firebase_storage: ^11.3.5
  firebase_messaging: ^14.7.10

  # Utilities
  intl: ^0.19.0
  image_picker: ^1.0.4
  cached_network_image: ^3.3.0
  path_provider: ^2.1.1
  url_launcher: ^6.2.5
  supabase_flutter: ^2.5.6
  video_player: ^2.9.2
  video_thumbnail: ^0.5.3
  visibility_detector: ^0.4.0+2
  file_picker: ^8.0.0
  connectivity_plus: ^6.0.5
  record: ^5.2.1
  audioplayers: ^5.2.1
  google_sign_in: ^6.2.2
  country_code_picker: ^3.3.0
  media_store_plus: ^0.1.3
  flutter_webrtc: ^0.12.6+hotfix.1


  # Maps & Location
  geolocator: ^10.1.0
  geocoding: ^2.1.1
  flutter_map: ^6.2.1
  latlong2: ^0.9.1

  # Forms & Validation
  # formz removed (unused)

dependency_overrides:
  record_platform_interface: 1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.8
  # codegen tools removed (unused)
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/app_icon.png
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: assets/images/app_icon.png
  min_sdk_android: 21

fonts:
  - family: RobotoMono
    fonts:
      - asset: assets/fonts/RobotoMono-Regular.ttf
      - asset: assets/fonts/RobotoMono-Bold.ttf
        weight: 700

